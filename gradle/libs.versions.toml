[versions]

kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
# Nucleus 2.4.2 is built against the Compose 1.11 train; material3 1.12.x drags compose.ui to 1.12
# and breaks Tao (NoSuchMethodError CanvasLayersComposeScene). Stay on 1.11 → compose.ui resolves to 1.11.1.
# ponytail: pinned to 1.11 train for Nucleus compat; bump when Nucleus ships a 1.12-built release.
material3 = "1.11.0-alpha07"
agp = "9.1.1"
androidx-activityCompose = "1.12.0"
kotlinx-coroutines = "1.11.0"
ktor = "3.5.2"
androidx-lifecycle = "2.11.0"
androidx-nav3 = "1.2.0-alpha02"
nav3-browser = "1.1.0"
metro = "1.4.1"
multiplatformSettings = "1.3.0"
kotlinx-datetime = "0.8.0"
sqlDelight = "2.3.2"
materialKolor = "5.0.0"
nucleus = "2.4.2"
litertlm = "0.16.0"
filekit = "0.15.0"
structured-coroutines = "1.1.0"
piper-jni = "1.4.2"
detekt = "2.0.0-alpha.6"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
compose-rules = "0.6.4"

[libraries]

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
